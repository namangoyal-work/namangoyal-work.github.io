<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Link-preview card. Flat and undecorated, same restraint as the site:
    no gradients, no glow, hairline rules, one typeface.
  -->
  <rect width="1200" height="630" fill="#0d0d0e"/>

  <!-- monogram -->
  <rect x="80" y="72" width="64" height="64" rx="3" fill="#ededee"/>
  <text x="112" y="115" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="26" font-weight="700" fill="#0d0d0e" text-anchor="middle">NG</text>

  <!-- name -->
  <text x="80" y="330" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="700" fill="#ededee" letter-spacing="-4">Naman Goyal</text>

  <!-- facts, in mono -->
  <text x="80" y="386" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="23" fill="#9d9da3">Electrical Engineering, IIT Delhi · Dept. Rank 1</text>
  <text x="80" y="424" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="23" fill="#6e6e74">Incoming Quant SWE Intern · Virtu Financial · Summer 2027</text>

  <!-- hairline -->
  <rect x="80" y="502" width="1040" height="1" fill="#ffffff" fill-opacity="0.13"/>

  <text x="80" y="552" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="21" fill="#6e6e74">Low-latency C++ · FPGA · Hardware security</text>
  <text x="1120" y="552" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="21" fill="#9d9da3" text-anchor="end">namangoyal.me</text>
</svg>
